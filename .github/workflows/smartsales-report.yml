name: SmartSales Automated Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Generate Excel report
        run: |
          python src/smartsales_stage3.py \
            data/raw/sales_data_1500_with_invalid.csv \
            reports/automated/smartsales_report.xlsx

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        with:
          name: smartsales-report
          path: reports/automated/smartsales_report.xlsx
          if-no-files-found: error
          retention-days: 14
